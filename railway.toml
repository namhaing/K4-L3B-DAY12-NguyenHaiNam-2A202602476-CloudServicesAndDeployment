# CP5 — Cấu hình deploy Railway (dùng nếu bạn chọn Railway).
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong dashboard hoặc:
#     railway variables --set AGENT_API_KEY=...
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Không đặt startCommand: dùng CMD của Dockerfile (`sh -c "exec uvicorn ... --port ${PORT:-8000}"`).
# startCommand của Railway chạy dạng exec, không qua shell → `$PORT` có thể không được mở rộng,
# và mất `exec` → uvicorn không còn là PID 1 để nhận SIGTERM (graceful shutdown ở CP4).
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
