# CI/CD: mỗi lần push/PR → chạy test + build image trên máy sạch;
# chỉ khi cả hai xanh VÀ là push lên main → deploy lên Railway rồi smoke test.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Hai lần push liên tiếp không deploy chồng lên nhau
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (pytest CP1–CP4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài dependency
        run: pip install -r requirements.txt

      # test_cp5 gọi vào bản deploy đang sống, test_bonus_cicd kiểm tra chính badge
      # của workflow này → loại ra. Test build Docker (mark `docker`) đã có job `build` lo.
      - name: Chạy pytest
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: pytest tests/ -v -m "not docker" --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t day12-agent:ci .

      - name: Kiểm tra image
        run: |
          docker images day12-agent:ci
          test "$(docker run --rm --entrypoint whoami day12-agent:ci)" = "appuser"

      # Chạy thử container thật: app khởi động được và /health trả 200
      - name: Smoke test container
        run: |
          docker run -d --name agent -p 8000:8000 \
            -e AGENT_API_KEY=ci-dummy -e REDIS_URL=fake:// day12-agent:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs agent
          exit 1

  deploy:
    name: Deploy lên Railway
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # Project token (Railway → project → Settings → Tokens), lưu ở GitHub Secrets
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://agent-production-96f4.up.railway.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cài Railway CLI
        run: npm install -g @railway/cli

      - name: railway up
        run: railway up --service agent --ci

      # Deploy xong chưa đủ — phải chắc service còn sống và nối được Redis
      - name: Smoke test bản deploy
        run: |
          for i in $(seq 1 18); do
            if curl -fsS "$PUBLIC_URL/health" && curl -fsS "$PUBLIC_URL/ready"; then
              echo
              code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$PUBLIC_URL/ask" \
                -H "Content-Type: application/json" -d '{"question":"ci"}')
              test "$code" = "401" && exit 0
            fi
            sleep 10
          done
          exit 1
